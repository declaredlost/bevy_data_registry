# https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace]
resolver = "3"
members = [
    "./crates/bevy_data_registry",
    "./crates/bevy_data_registry_macros",
]

[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

authors = ["Oleh Martsokha <o.martsokha@gmail.com>"]
repository = "https://github.com/declaredlost/bevy_data_registry"

# Shared lints for every crate (opt in with `[lints] workspace = true`).
# The whole of `clippy::pedantic` is denied.
[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
# Lint exceptions are `#[expect]`s with a reason, so stale ones are reported.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
# Bevy systems take `Res`, `Query` and `Commands` by value by design.
needless_pass_by_value = "allow"
# Bevy systems naturally have many resource params and complex `Query`
# types: these lints fire on idiomatic Bevy code, so they're allowed
# workspace-wide rather than per system.
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# Default features are disabled for certain dependencies to allow
# downstream workspaces/crates to selectively enable them as needed.
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329

# Game engine (headless by default)
bevy = { version = "0.20", default-features = false, features = ["std"] }
# The derive macro, re-exported by the crate
bevy_data_registry_macros = { path = "./crates/bevy_data_registry_macros", version = "0.1.0" }

# Writing the derive macro
proc-macro2 = { version = "1.0", default-features = false }
quote = { version = "1.0", default-features = false }
syn = { version = "2.0", default-features = false }

# (De)serialization
ron = { version = "0.12", features = [] }
serde = { version = "1.0", features = ["derive"] }
# Testing: a second data format, written outside the crate
serde_json = { version = "1.0", default-features = false, features = ["std"] }
# Testing: a folder of its own for each hot reload test
tempfile = "3.27"
# Deserializing a definition whose kind is only known at runtime
erased-serde = { version = "0.4", default-features = false, features = ["std"] }
# Error types
thiserror = { version = "2.0", default-features = false }

# Testing: the app, headless, stepped tick by tick
bevy_harness = { git = "https://github.com/declaredlost/bevy_harness", branch = "main", version = "0.1.0" }

# Development: compile our code with light optimizations for fast iteration,
# and dependencies (Bevy) fully optimized so tests run quickly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
