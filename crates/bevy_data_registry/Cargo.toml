# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "bevy_data_registry"
description = "Data definitions for Bevy: files claimed per kind by name, folder or extension, indexed by id, validated and hot-reloaded"
keywords = ["bevy", "data", "definitions", "ron", "assets"]

version = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }

authors = { workspace = true }
repository = { workspace = true }

[features]
# Development: hot-reload definitions when their files change.
dev = ["bevy/file_watcher"]

[dependencies]
# Game engine
bevy = { workspace = true, features = ["bevy_asset", "bevy_log", "bevy_state"] }
bevy_data_registry_macros = { workspace = true }

# (De)serialization
erased-serde = { workspace = true }
ron = { workspace = true, features = [] }
serde = { workspace = true, features = [] }
thiserror = { workspace = true }

[dev-dependencies]
bevy_harness = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "hot_reload"
required-features = ["dev"]

[lints]
workspace = true
